name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.editor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [vim, nvim]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh tmux
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: ${{ matrix.editor == 'nvim' }}
      - name: Unit tests
        run: test/run.sh ${{ matrix.editor }}
      - name: End-to-end tests
        run: test/e2e.sh ${{ matrix.editor }}
